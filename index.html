<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPP-RL 2027 · Klinikplanung v16.2</title>
</head>
<body>
<div id="boot" style="font-family:system-ui;padding:24px">PPP-RL Planer v16.2 wird geladen …</div>
<script>
(function(){
  var src='https://raw.githubusercontent.com/ulrichkastner/PPP-RL-Planer/8374ce5aa83b336f54cc2734c0142eba4984ccd3/index.html';
  fetch(src,{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(html){
      document.open();
      document.write(html);
      document.close();
      setTimeout(function(){
        var s=document.createElement('script');
        s.src='v15-patch.js?v=16.2-accordion-2';
        s.onload=function(){console.log('PPP-RL v16.2 patch loaded');};
        s.onerror=function(){console.error('PPP-RL v16.2 patch failed to load');};
        document.body.appendChild(s);
      },800);
    })
    .catch(function(err){document.getElementById('boot').textContent='Fehler beim Laden des PPP-RL Planers: '+err.message;});
})();
</script>
</body>
</html>
